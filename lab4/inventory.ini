# Group: Web Servers (Managed Nodes)
[webservers]
web-server-1 ansible_host=localhost ansible_port=2201
web-server-2 ansible_host=localhost ansible_port=2202

# Group: Database Servers (Managed Nodes)
[dbservers]
db-server-1  ansible_host=localhost ansible_port=2203

# Group: All Production Servers (Parent Group)
[production:children]
webservers
dbservers

# Global Variables cho tất cả hosts
[all:vars]
ansible_user=root
ansible_password=root
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
