---
# ============================================
# DevOps Lab 4 — Playbook: Cấu hình Web Server
# Sinh viên: NGUYỄN VĂN NAM - DTC235180129
# TÍCH HỢP BÀI TẬP MỞ RỘNG: JINJA2 TEMPLATE & HANDLERS
# ============================================
- name: Configure Web Servers with Jinja2 Template & Handlers
  hosts: webservers
  become: yes            # Chạy với quyền root
  gather_facts: yes      # Thu thập thông tin hệ thống (facts)

  vars:
    web_package: apache2
    web_service: apache2
    web_root: /var/www/html

  tasks:
    # Task 1: Cập nhật apt cache
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # Task 2: Cài đặt Apache Web Server
    - name: Install Apache web server
      apt:
        name: "{{ web_package }}"
        state: present

    # Task 3: Đảm bảo Apache đang chạy và tự khởi động cùng OS
    - name: Ensure Apache is running and enabled
      service:
        name: "{{ web_service }}"
        state: started
        enabled: yes

    # Task 4 [BÀI TẬP MỞ RỘNG]: Triển khai trang web động bằng Jinja2 Template và gọi Handler
    - name: Deploy dynamic index.html using Jinja2 Template
      template:
        src: templates/index.html.j2
        dest: "{{ web_root }}/index.html"
        mode: '0644'
      notify: restart apache2

    # Task 5: Mở port 80 trong firewall (nếu có ufw)
    - name: Allow HTTP through firewall
      ufw:
        rule: allow
        port: '80'
        proto: tcp
      ignore_errors: yes

  # [BÀI TẬP MỞ RỘNG]: Handler tự động kích hoạt khi có thay đổi cấu hình/template
  handlers:
    - name: restart apache2
      service:
        name: "{{ web_service }}"
        state: restarted
