# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Tự động kiểm tra, audit Lighthouse và deploy lên GitHub Pages
# Sinh viên: NGUYỄN VĂN NAM - DTC235180129 (ICTU)
# ============================================================

name: Deploy to GitHub Pages

# === Khi nào pipeline chạy? ===
on:
  push:
    branches: [main]       # Chạy khi push lên nhánh main
  workflow_dispatch:        # Cho phép chạy thủ công từ GitHub UI

# Cấp quyền ghi nội dung repository để deploy sang nhánh gh-pages
permissions:
  contents: write

# === Các job trong pipeline ===
jobs:
  # Job: Build, Audit & Deploy
  build-and-deploy:
    runs-on: ubuntu-latest   # Chạy trên máy ảo Ubuntu (free)

    steps:
      # Step 1: Checkout code từ GitHub
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kiểm tra HTML và tài nguyên cơ bản của Lab 1
      - name: 🧪 Validate Files (HTML & Assets)
        run: |
          echo "=== KIỂM TRA MÃ NGUỒN VÀ TÀI NGUYÊN LAB 1 ==="
          for file in lab1/index.html lab1/about.html lab1/contact.html lab1/avatar.png; do
            if [ -f "$file" ]; then
              echo "✅ $file found! (Size: $(wc -c < "$file") bytes)"
            else
              echo "❌ $file NOT found!"
              exit 1
            fi
          done
          echo "🎉 Tất cả các trang HTML và avatar Lab 1 đã sẵn sàng!"

      # Step 3: Google Lighthouse CI Audit (Bài tập mở rộng)
      - name: 🔍 Audit với Google Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: './lab1/lighthouserc.json'
          uploadArtifacts: true

      # Step 4: Deploy lên GitHub Pages từ thư mục lab1
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./lab1
          publish_branch: gh-pages
          commit_message: "Auto-deploy: Multi-page, Avatar and Lighthouse CI [skip ci]"
